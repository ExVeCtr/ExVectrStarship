; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = teensy40

[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
upload_port = COM9
; ExVectrNetwork: the generated ExVectrPackets headers live in lib/ExVectrPackets/gen (not include/).
; USB Serial carries only ExVectrNetwork stream frames: the platform must not print console text on it.
; If a local, gitignored src/sx12xxAL folder is still present it is not part of the firmware: the filter below keeps it out
; of the build (checked: without the filter its sources are compiled into the image).
build_flags =
  -Ilib/ExVectrPackets/gen
  -DEXVECTR_ARDUINO_NO_SERIAL_CONSOLE
build_src_filter = +<*> -<sx12xxAL/> -<.git/> -<.svn/>

; Host tests of the platform-free code (src/comms/telemetry_mapping.cpp, vehicle_network.cpp,
; src/safety/estimator_zeroing.cpp, src/safety/mission_chain.cpp, src/safety/control_phase.cpp,
; src/safety/mission_abort.cpp, src/gnss_config_sequencer.cpp, src/calibration/) with the
; ExVectrNetwork wire/link/net sources, the pure ExVectrDSP calibration module and the pure body simulator model
; (ExVectrDSP body_sim_model + ExVectrControl physics_bodysim, harness test/test_sim_aero): pio test -e native
[env:native]
platform = native
test_framework = unity
test_build_src = yes
lib_ldf_mode = off
lib_compat_mode = off
lib_deps = throwtheswitch/Unity@^2.6.1
build_flags = -std=gnu++17 -Wall -Wextra -g -Isrc -Ilib/ExVectrPackets/gen -Ilib/ExVectrNetwork/include
  -Ilib/ExVectrDSP/include
  -Ilib/ExVectrMath/include -Ilib/ExVectrControl/include -Ilib/ExVectrCore/include -Ilib/ExVectrData/include
  -DUNITY_INCLUDE_DOUBLE
build_src_filter =
  -<*>
  +<comms/telemetry_mapping.cpp>
  +<comms/vehicle_network.cpp>
  +<comms/cmd_ingress_tap.cpp>
  +<safety/estimator_zeroing.cpp>
  +<safety/mission_chain.cpp>
  +<safety/mission_profile.cpp>
  +<safety/control_phase.cpp>
  +<safety/motor_enable.cpp>
  +<safety/bellyflop_kick.cpp>
  +<safety/mission_abort.cpp>
  +<safety/sim_flap_fault.cpp>
  +<safety/command_ingress.cpp>
  +<safety/rc_mapper.cpp>
  +<safety/rc_command.cpp>
  +<safety/motor_interlock.cpp>
  +<safety/stop_altitude.cpp>
  +<gnss_config_sequencer.cpp>
  +<calibration/>
  +<../lib/ExVectrNetwork/src/wire/>
  +<../lib/ExVectrNetwork/src/link/>
  +<../lib/ExVectrNetwork/src/net/>
  +<../lib/ExVectrDSP/src/calibration/>
  +<../lib/ExVectrDSP/src/body_sim_model.cpp>
  +<../lib/ExVectrControl/src/physics_bodysim.cpp>
  +<../lib/ExVectrData/src/memory_manager.cpp>
  +<../test/support/native_core_stubs.cpp>

; Bench-only UART pin scan (tools/pinscan/pinscan.cpp, driven by tools/uart_pin_scan.py). Links no flight code and
; no ExVectr library. Build: pio run -e teensy40_pinscan
[env:teensy40_pinscan]
platform = teensy
board = teensy40
framework = arduino
lib_ldf_mode = off
build_src_filter = -<*> +<../tools/pinscan/>
